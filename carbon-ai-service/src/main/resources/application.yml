spring:
  application:
    name: carbon-ai-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/carbon
    username: ${POSTGRE_USER:carbon}
    password: ${POSTGRE_PASSWORD:carbonpass}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  cloud:
    stream:
      bindings:
        rawContentConsumer-in-0:
          destination: raw-content
          group: carbon-ai-service
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}

server:
  port: ${PORT:8081}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.carbon.ai: DEBUG

carbon:
  analytics:
    stop-words: the, a, an, is, are, was, were, be, been, being,
                  and, or, but, if, while, when, where, how, what, why, who,
                  for, to, of, in, on, at, by, with, from, up, out, about,
                  this, that, these, those, i, you, he, she, it, we, they,
                  me, him, her, us, them, my, your, his, its, our, their,
                  can, could, will, would, shall, should, may, might, must,
                  do, does, did, have, has, had, so, than, more, most
    min-word-length: 3
    recent-searches-limit: 1000
    top-words-limit: 5
