spring:
  application:
    name: carbon-ai-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/carbon
    username: ${POSTGRE_USER:carbon}
    password: ${POSTGRE_PASSWORD:carbonpass}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  cloud:
    stream:
      bindings:
        rawContentConsumer-in-0:
          destination: raw-content
          group: carbon-ai-service
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}

server:
  port: ${PORT:8081}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.carbon.ai: DEBUG

